<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18241d">
<link rel="manifest" href="manifest.webmanifest">
<title>What Should We Do?</title>
<style>
:root{--bg:#f4f0e7;--ink:#18241d;--card:#fffdf8;--muted:#69736d;--line:#d8d4ca}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:720px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
header{text-align:center;padding:18px 0 10px} h1{font-size:38px;line-height:1;margin:0 0 8px;letter-spacing:-1.5px} .sub{color:var(--muted)}
button,select{font:inherit}.primary{width:100%;border:0;border-radius:18px;padding:18px;font-weight:800;font-size:19px;background:var(--ink);color:white;margin:18px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 6px 22px #0000000a}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 16px}.badge{background:#ece9e0;border-radius:999px;padding:6px 9px;font-size:13px}
h2{font-size:29px;margin:0}.label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:800;margin-top:18px}.body{font-size:17px;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.secondary{border:1px solid var(--ink);background:transparent;border-radius:13px;padding:12px;font-weight:700}
.stats{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.mode-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}.mode{border:1px solid var(--line);background:var(--card);padding:11px;border-radius:999px;font-weight:750}.mode.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.time-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.custom{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px}.custom input{min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit}
.session-item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.session-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.session-top h3{margin:0;font-size:21px}.session-time{font-weight:800;white-space:nowrap}.session-total{font-size:28px;font-weight:850;margin:22px 0 6px}.session-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.safety{padding:12px;border-radius:12px;background:#f0eee7;font-size:14px;line-height:1.4}
.why{font-size:16px;line-height:1.5;color:#39423d}.steps{padding:0;margin:8px 0 0;list-style:none;counter-reset:step}.steps li{counter-increment:step;display:grid;grid-template-columns:30px 1fr;gap:10px;margin:13px 0;line-height:1.45}.steps li:before{content:counter(step);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:white;font-weight:800;font-size:13px}
.tipbox{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.tip{margin:8px 0;line-height:1.4}.variations{display:grid;gap:9px;margin-top:9px}.variation{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:start;line-height:1.4}.vtag{font-size:11px;font-weight:850;text-align:center;border-radius:5px;padding:5px;background:#e9e5dc}.meta-footer{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin:20px -20px -20px}.meta-footer div{text-align:center;padding:12px 4px;border-right:1px solid var(--line);font-weight:750}.meta-footer div:last-child{border-right:0}.meta-footer small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
</style>
</head>
<body><main>
<header><h1>What Should We Do?</h1><div class="sub">Arya needs something to do.</div></header>
<div class="mode-nav">
<button class="mode active" id="browseMode">Activity Picker</button>
<button class="mode" id="timeMode">Fill My Time</button>
</div>
<section id="pickerPage"><div class="filters">
<select id="time"><option value="">Any time</option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="20">20+ min</option></select>
<select id="cat"><option value="">Any type</option><option>Sniff</option><option>Think</option><option>Train</option><option>Play</option><option>Chill</option></select>
<select id="where"><option value="">Inside or backyard</option><option>Inside</option><option>Backyard</option></select>
<select id="food"><option value="">Food or no food</option><option value="yes">Treats okay</option><option value="no">No treats</option></select>
</div>
<button class="primary" id="pick">🎲 PICK AN ACTIVITY</button>
<section class="card" id="card" hidden>
<h2 id="title"></h2><div class="badges" id="badges"></div>
<div class="label">You'll need</div><div class="body" id="gear"></div>
<div class="body" id="steps"></div>
<div class="label">Variations</div><div class="body" id="harder"></div>
<div class="label">Supervision</div><div class="safety" id="safety"></div>
<div class="actions"><button class="secondary" id="done">✓ WE DID IT</button><button class="secondary" id="another">🎲 ANOTHER</button></div>
</section>
<div class="stats" id="stats"></div></section>
<section id="timePage" hidden>
<div class="card time-card">
<h2>How much time do you have?</h2>
<p class="body">Pick a time budget and Arya will get a randomized mini-session that fits it.</p>
<div class="time-buttons">
<button class="secondary timepick" data-min="10">10 min</button>
<button class="secondary timepick" data-min="15">15 min</button>
<button class="secondary timepick" data-min="20">20 min</button>
<button class="secondary timepick" data-min="30">30 min</button>
<button class="secondary timepick" data-min="45">45 min</button>
<button class="secondary timepick" data-min="60">60 min</button>
</div>
<div class="custom"><input id="customMinutes" type="number" min="5" max="120" step="5" inputmode="numeric" placeholder="Custom minutes"><button class="secondary" id="customGo">Build it</button></div>
</div>
<div id="session"></div>
</section>
</main>
<script src="activities.js"></script>
<script>
let recent=JSON.parse(localStorage.getItem('recent')||'[]'), completed=Number(localStorage.getItem('completed')||0);
const $=id=>document.getElementById(id);
function filtered(){
 let x=ACTIVITIES.slice(), t=$('time').value,c=$('cat').value,w=$('where').value,f=$('food').value;
 if(t){let n=+t;x=x.filter(a=>n===20?a.minutes>=20:a.minutes===n)}
 if(c)x=x.filter(a=>a.category===c); if(w)x=x.filter(a=>a.where===w);
 if(f)x=x.filter(a=>f==='yes'?a.food:!a.food); return x;
}
function pick(){
 let pool=filtered(); if(!pool.length){alert("No activities match those filters. Try widening them.");return}
 let fresh=pool.filter(a=>!recent.includes(a.id)); if(fresh.length)pool=fresh;
 show(pool[Math.floor(Math.random()*pool.length)]);
}
function show(a){
 $('card').hidden=false;$('title').textContent=a.title;
 $('badges').innerHTML=[a.category,a.minutes+" min",a.where,a.food?"Treats":"No treats"].map(x=>`<span class="badge">${x}</span>`).join('');
 $('gear').textContent=a.gear;
 $('steps').innerHTML=`<div class="label">Why it works</div><div class="why">${a.why}</div>
 <div class="label">How to play</div><ol class="steps">${a.instructions.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>
 <div class="tipbox"><div class="label">Pro tips</div>${a.proTips.map(t=>`<div class="tip">• ${t}</div>`).join('')}</div>`;
 $('harder').innerHTML=`<div class="variations">
 <div class="variation"><span class="vtag">EASIER</span><span>${a.easier}</span></div>
 <div class="variation"><span class="vtag">HARDER</span><span>${a.harder}</span></div>
 <div class="variation"><span class="vtag">SENIOR</span><span>${a.senior}</span></div></div>`;
 const sm={"🟢":"Normal supervision.","🟡":"Keep an eye on Arya; remove anything she starts chewing apart.","🔴":"Active supervision. Arya likes to chew; stop the activity if she starts swallowing non-food material."};
 $('safety').textContent=a.rating+" "+sm[a.rating];
 $('safety').insertAdjacentHTML('afterend',`<div class="meta-footer"><div>${a.level}<small>Level</small></div><div>${a.who}<small>Who</small></div><div>${a.minutes} min<small>Time</small></div></div>`);
 recent.push(a.id);recent=recent.slice(-12);localStorage.setItem('recent',JSON.stringify(recent)); window.scrollTo({top:260,behavior:'smooth'});
}
$('pick').onclick=pick;$('another').onclick=pick;$('done').onclick=()=>{completed++;localStorage.setItem('completed',completed);stats();pick()};

const pickerPage=$('pickerPage'), timePage=$('timePage');
function setMode(which){
 const time=which==='time';
 pickerPage.hidden=time; timePage.hidden=!time;
 $('browseMode').classList.toggle('active',!time); $('timeMode').classList.toggle('active',time);
 window.scrollTo({top:0,behavior:'smooth'});
}
$('browseMode').onclick=()=>setMode('picker');
$('timeMode').onclick=()=>setMode('time');

function buildSession(budget){
 budget=Math.max(5,Math.min(120,Number(budget)||20));
 let choices=ACTIVITIES.slice(), chosen=[], used=0, lastCat='';
 // Prefer variety and fit as close as possible without exceeding the budget.
 while(true){
   let remaining=budget-used;
   let candidates=choices.filter(a=>a.minutes<=remaining && !chosen.some(x=>x.id===a.id));
   if(!candidates.length) break;
   let varied=candidates.filter(a=>a.category!==lastCat);
   if(varied.length) candidates=varied;
   let maxFit=Math.max(...candidates.map(a=>a.minutes));
   let good=candidates.filter(a=>a.minutes===maxFit || a.minutes>=Math.max(5,remaining-10));
   let a=good[Math.floor(Math.random()*good.length)];
   chosen.push(a); used+=a.minutes; lastCat=a.category;
   if(budget-used<5) break;
 }
 const s=$('session');
 s.innerHTML=`<div class="session-total">${used}-minute Arya session</div>
 <div class="sub">Randomized for a ${budget}-minute time budget${used<budget?` · ${budget-used} min left open`:''}.</div>`+
 chosen.map((a,i)=>`<div class="session-item">
   <div class="session-top"><h3>${i+1}. ${a.title}</h3><div class="session-time">${a.minutes} min</div></div>
   <div class="badges"><span class="badge">${a.category}</span><span class="badge">${a.where}</span><span class="badge">${a.food?'Treats':'No treats'}</span></div>
   <div class="label">Why it works</div><div class="why">${a.why}</div>
   <div class="label">You'll need</div><div class="body">${a.gear}</div>
   <div class="label">How to play</div><ol class="steps">${a.instructions.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>
   <div class="label">Pro tips</div>${a.proTips.map(t=>`<div class="tip">• ${t}</div>`).join('')}
   <div class="label">Variations</div><div class="variations"><div class="variation"><span class="vtag">EASIER</span><span>${a.easier}</span></div><div class="variation"><span class="vtag">HARDER</span><span>${a.harder}</span></div><div class="variation"><span class="vtag">SENIOR</span><span>${a.senior}</span></div></div>
   <div class="label">Supervision</div><div class="safety">${a.rating} ${{"🟢":"Normal supervision.","🟡":"Keep an eye on Arya; remove anything she starts chewing apart.","🔴":"Active supervision. Arya likes to chew; stop if she starts swallowing non-food material."}[a.rating]}</div>
 </div>`).join('')+
 `<div class="session-actions"><button class="secondary" onclick="buildSession(${budget})">↻ RANDOMIZE AGAIN</button><button class="secondary" onclick="finishSession(${chosen.length})">✓ WE DID IT</button></div>`;
 s.scrollIntoView({behavior:'smooth',block:'start'});
}
function finishSession(n){
 completed+=n; localStorage.setItem('completed',completed); stats();
 $('session').innerHTML='<div class="card"><h2>Nice work.</h2><p class="body">Session complete. Arya got a good mix of work and play.</p></div>';
}
document.querySelectorAll('.timepick').forEach(b=>b.onclick=()=>buildSession(b.dataset.min));
$('customGo').onclick=()=>buildSession($('customMinutes').value);

function stats(){$('stats').textContent=completed?`Arya activities completed on this phone: ${completed}`:"50 original enrichment activities for Arya";}
stats();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
